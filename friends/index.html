  // 将 Astro 数据传递给客户端脚本
  const articles = article_data || [];
  const stage = document.getElementById('danmaku-stage');
  const template = document.getElementById('danmaku-template');

  if (!stage || !template || articles.length === 0) {
    console.warn('弹幕容器或数据不存在');
  } else {
    // --- 配置参数 ---
    const TRACK_HEIGHT = 50; // 每条轨道的高度（像素）
    const TRACK_GAP = 8; // 轨道间的垂直间距
    const MIN_SPEED = 12; // 最小动画时长（秒）
    const MAX_SPEED = 25; // 最大动画时长（秒）
    const INITIAL_DELAY_RANGE = 5000; // 初始延迟范围（毫秒）

    let trackCount = Math.floor(stage.clientHeight / (TRACK_HEIGHT + TRACK_GAP));
    if (trackCount < 1) trackCount = 1;

    let currentTrack = 0;

    // 创建弹幕元素
    function createDanmaku(article) {
      const clone = template.content.cloneNode(true);
      const item = clone.querySelector('.danmaku-item');
      const avatar = clone.querySelector('.danmaku-avatar');
      const content = clone.querySelector('.danmaku-content');

      // 设置内容
      item.href = article.link;
      avatar.src = article.avatar || '';
      avatar.alt = article.author || '';
      content.textContent = article.title;
      // 可选：添加作者和日期
      // content.textContent = `${article.author} · ${article.title}`;

      // 计算垂直位置（轨道）
      const top = currentTrack * (TRACK_HEIGHT + TRACK_GAP);
      item.style.top = `${top}px`;
      currentTrack = (currentTrack + 1) % trackCount;

      // 随机动画时长（速度）
      const duration = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
      item.style.animationDuration = `${duration}s`;

      // 随机初始延迟，让弹幕错开出现
      const delay = Math.random() * INITIAL_DELAY_RANGE;
      item.style.animationDelay = `${delay}ms`;

      // 动画结束后移除元素，防止内存堆积
      item.addEventListener('animationend', () => {
        item.remove();
      });

      // 添加到舞台
      stage.appendChild(item);
    }

    // 初始加载：循环创建弹幕，直到所有文章都出现
    // 这里我们设置一个间隔，让弹幕陆续出现
    const SPAWN_INTERVAL = 800; // 每 800ms 出现一条新弹幕
    let articleIndex = 0;

    function spawnNext() {
      if (articleIndex >= articles.length) {
        // 所有文章都已生成，可以考虑循环或停止
        // 这里我们选择循环，让弹幕持续滚动
        articleIndex = 0;
      }
      createDanmaku(articles[articleIndex]);
      articleIndex++;
    }

    // 先立即生成一批，然后定时生成
    for (let i = 0; i < Math.min(8, articles.length); i++) {
      spawnNext();
    }

    // 持续生成新弹幕
    setInterval(spawnNext, SPAWN_INTERVAL);

    // 窗口大小变化时重新计算轨道数
    window.addEventListener('resize', () => {
      const newTrackCount = Math.floor(stage.clientHeight / (TRACK_HEIGHT + TRACK_GAP));
      if (newTrackCount > 0) {
        trackCount = newTrackCount;
        // 注意：正在运动的弹幕位置不会改变，但新弹幕会使用新的轨道数
      }
    });
  }
})();</script>  <!-- </div>
